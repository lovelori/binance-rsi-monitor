name: RSI overbought monitor

on:
  schedule:
    # UTC 每 30 分钟一次。GitHub 定时任务在高峰期可能延迟数分钟到数十分钟
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只打印结果、不发邮件
        type: boolean
        default: false
      probe:
        description: 只测行情端点连通性（排查地区封锁）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rsi-monitor
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 冷却状态存在 Actions 缓存里，用递增 key 保证每次都能覆盖写回
      - name: Restore alert state
        uses: actions/cache@v4
        with:
          path: state
          key: rsi-state-${{ github.run_id }}
          restore-keys: rsi-state-

      - name: Probe endpoints
        if: github.event.inputs.probe == 'true'
        run: python rsi_monitor.py --probe

      - name: Scan and mail
        if: github.event.inputs.probe != 'true'
        run: python rsi_monitor.py ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          # gate：币安合约接口对美国 IP 返回 451，Runner 上只有 Gate 等少数交易所可达
          DATA_SOURCE: gate
          RSI_PERIOD: "14"
          RSI_THRESHOLD: "80"
          RSI_INTERVALS: "4h,1d"
          # any = 任一周期 RSI>阈值即推送；改成 all 则要求两个周期同时满足
          MATCH_MODE: any
          # 覆盖范围：100k 约 200 个候选；降到 30000 约 290 个，升到 1000000 约 77 个
          MIN_QUOTE_VOLUME: "100000"
          # 费率为正 = 多头向空头支付，多头拥挤
          REQUIRE_POSITIVE_FUNDING: "1"
          # 用币安现货上线名单剔除 Gate 独有标的（币安合约接口被地区封锁，拿不到合约名单）
          REQUIRE_ON_BINANCE: "1"
          ALERT_COOLDOWN_HOURS: "6"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_NAME: Binance RSI Monitor
          MAIL_TO: ${{ secrets.MAIL_TO }}

      - name: Show alert state
        run: cat state/last_alerts.json || echo "no state yet"
